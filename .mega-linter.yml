# Configuration file for MegaLinter
#
# See all available variables at https://megalinter.io/latest/config-file/ and in
# linters documentation

# all, none, or list of linter keys
APPLY_FIXES: all

# If you use ENABLE variable, all other languages/formats/tooling-formats will
# be disabled by default
# ENABLE:

# If you use ENABLE_LINTERS variable, all other linters will be disabled by
# default
# ENABLE_LINTERS:

DISABLE:
  - SPELL # Uncomment to disable checks of spelling mistakes
  # - COPYPASTE # Uncomment to disable checks of excessive copy-pastes

SHOW_ELAPSED_TIME: true

# Uncomment if you want MegaLinter to detect errors but not block CI to pass
# DISABLE_ERRORS: true

PYTHON_BANDIT_FILTER_REGEX_EXCLUDE: ^molecule?/

# config is created during megalinter ci run and king fisher complains about credential in there
REPOSITORY_KINGFISHER_ARGUMENTS: "--exclude .git/"

# gitleaks defaults to `git log --all`, so every branch's run also scans every
# other branch's commits - one secret on an unmerged branch turns CI red
# everywhere. HEAD keeps the full history of the branch under test (on main,
# all of main) while ignoring refs that branch does not contain.
REPOSITORY_GITLEAKS_ARGUMENTS: "--log-opts=HEAD"
