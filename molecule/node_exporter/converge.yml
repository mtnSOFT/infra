---
- name: Converge
  hosts: all
  become: true
  vars:
    # Non-default values so the rendered ARGS line is actually asserted.
    # --log.level is stable across node_exporter versions, unlike collector flags.
    node_exporter_bind_ip: "127.0.0.1"
    node_exporter_extra_args:
      - "--log.level=warn"
  roles:
    - node_exporter
