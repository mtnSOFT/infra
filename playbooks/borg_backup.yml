---
# Server and clients together, in the order a new client needs: the client
# generates its SSH key, the server authorizes it, then the client creates its
# repository over that access.

- name: Prepare borgmatic clients (packages + SSH key)
  hosts: borgmatic_clients
  become: yes
  tasks:
    - name: Update apt cache (from linux_base)
      include_role:
        name: linux_base
        tasks_from: 3_update-apt-cache

    - name: Install borgmatic
      include_role:
        name: borgmatic_client
        tasks_from: 1_install

    - name: Generate the borg SSH key
      include_role:
        name: borgmatic_client
        tasks_from: 2_ssh

- name: Configure borg servers
  ansible.builtin.import_playbook: borg_server.yml

- name: Configure borgmatic clients
  ansible.builtin.import_playbook: borgmatic_clients.yml
