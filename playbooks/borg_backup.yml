---
# Three plays because of the SSH key exchange: clients generate their key, the
# server authorizes every client key and creates the repositories, then clients
# get their borgmatic config and timer.

- name: Prepare borgmatic clients (packages + SSH key)
  hosts: borgmatic_clients
  become: yes
  tasks:
    - name: Update apt cache (from linux_base)
      include_role:
        name: linux_base
        tasks_from: 3_update-apt-cache

    - name: Install borgmatic
      include_role:
        name: borgmatic_client
        tasks_from: 1_install

    - name: Generate the borg SSH key
      include_role:
        name: borgmatic_client
        tasks_from: 2_ssh

- name: Configure borg servers
  hosts: borg_servers
  become: yes
  tasks:
    - name: Update apt cache (from linux_base)
      include_role:
        name: linux_base
        tasks_from: 3_update-apt-cache

    - name: Configure borg server
      include_role:
        name: borg_server

- name: Configure borgmatic clients
  hosts: borgmatic_clients
  become: yes
  roles:
    - role: borgmatic_client
