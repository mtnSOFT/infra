---
# Fail before writing anything: most mistakes here surface somewhere else - a
# wrong resolver looks like a provider outage, an unreadable key like a broken
# container.
#
# ansible.cfg sets no_log globally, which would censor these messages, hence
# no_log: false on every assert. Safe: assert reports the expression, not values.
- name: Validate the acme_client role inputs
  ansible.builtin.assert:
    that:
      - acme_client_certificates | length > 0
      - acme_client_email | length > 0
      - acme_client_dns_api_token | length > 0
      - acme_client_dns_provider | length > 0
    fail_msg: >-
      acme_client needs at least one entry in acme_client_certificates, plus
      acme_client_email, acme_client_dns_api_token (from vault) and
      acme_client_dns_provider. An empty certificate list is treated as a
      mistake rather than a no-op: it would install an API token and no timers,
      which looks like success until something expires.
  no_log: false

# Separate because this default must not be emptied.
- name: Validate the acme_client DNS resolvers
  ansible.builtin.assert:
    that:
      - acme_client_dns_resolvers | length > 0
    fail_msg: >-
      acme_client_dns_resolvers must not be empty. lego finds the challenge
      zone's apex and its authoritative nameservers with these resolvers, and
      this host resolves through the internal DNS, which is authoritative for
      the internal zones. Left at the system resolver, lego polls the internal
      server for a TXT record that only exists in the public zone at the
      provider and waits out the propagation timeout - no certificate, and an
      error that reads like a provider fault. Point these at public resolvers.
  no_log: false

# The token has its own 0600 file; unit files are world-readable.
- name: Assert no credential is set in acme_client_provider_env
  ansible.builtin.assert:
    that:
      - acme_client_provider_env.keys() | select('search', '(?i)token') | list | length == 0
    fail_msg: >-
      acme_client_provider_env becomes Environment= lines in a world-readable
      unit file, so it is for non-secret tuning only. The API token belongs in
      acme_client_dns_api_token, which is rendered to a 0600 file and passed to
      lego by path. Offending keys:
      {{ acme_client_provider_env.keys() | select('search', '(?i)token') | list }}.
  no_log: false

# Before the per-entry loop, which labels itself with item.zone. Uniqueness
# matters: the zone names the deploy dir and the systemd instance.
- name: Validate the acme_client certificate list structure
  ansible.builtin.assert:
    that:
      - acme_client_certificates | rejectattr('zone', 'defined') | list | length == 0
      - (acme_client_certificates | map(attribute='zone') | unique | list | length)
        == (acme_client_certificates | length)
    fail_msg: >-
      Every acme_client_certificates entry needs a `zone`, and the zones must be
      unique. Got:
      {{ acme_client_certificates | map(attribute='zone', default='<missing>') | list }}.
  no_log: false

# Both regexes are also injection guards: the .conf holds single-quoted shell,
# and the zone is used as a systemd instance name and a path component.
#
# Not enforced: wildcard count or position. Several wildcard SANs are legitimate.
# The real hazard is reordering - lego names files after the first domain - but
# that applies to any reorder and cannot be checked from one run. README gotcha.
- name: Validate each acme_client certificate entry
  ansible.builtin.assert:
    that:
      - item.zone is match('^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$')
      - item.domains | default(['*.' ~ item.zone]) | length > 0
      - >-
        item.domains | default(['*.' ~ item.zone])
        | reject('match', '^(\*\.)?[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$')
        | list | length == 0
      - item.reload_commands | default([]) is sequence
      - item.reload_commands | default([]) is not string
      - item.cert_mode | default('0644') | string is match('^0[0-7]{3}$')
      - item.key_mode | default('0640') | string is match('^0[0-7]{3}$')
    fail_msg: >-
      Invalid acme_client_certificates entry for zone {{ item.zone }}: {{ item }}.
      `zone` must be a lowercase DNS name, and `domains`, if given, must all be
      lowercase DNS names optionally prefixed with "*." - anything else could
      break out of the single-quoted shell values in the generated .conf.
      `reload_commands` must be a list. Modes must be quoted strings like "0640"
      - unquoted 0640 is read as octal by YAML and arrives as 416.
  no_log: false
  loop: "{{ acme_client_certificates }}"
  loop_control:
    label: "{{ item.zone }}"

# Defaults resolve once, here. Everything downstream reads these keys, so the
# .conf, the directories and the post-issue asserts cannot disagree.
- name: Resolve the acme_client certificate list
  ansible.builtin.set_fact:
    _acme_client_certs: "{{ _acme_client_certs | default([]) + [_entry] }}"
  vars:
    _domains: "{{ item.domains | default(['*.' ~ item.zone, item.zone]) }}"
    _server: "{{ item.server | default(acme_client_server) }}"
    _lego_dir: "{{ acme_client_state_dir }}/{{ _server | urlsplit('hostname') }}"
    # lego derives the filename from the first domain, "*" -> "_".
    _basename: "{{ _domains[0] | replace('*', '_') }}"
    _deploy_dir: "{{ item.deploy_dir | default(acme_client_deploy_dir_parent ~ '/' ~ item.zone) }}"
    _entry:
      zone: "{{ item.zone }}"
      domains: "{{ _domains }}"
      server: "{{ _server }}"
      renew_days: "{{ item.renew_days | default(acme_client_renew_days) }}"
      key_type: "{{ item.key_type | default(acme_client_key_type) }}"
      lego_dir: "{{ _lego_dir }}"
      src_cert: "{{ _lego_dir }}/certificates/{{ _basename }}.crt"
      src_key: "{{ _lego_dir }}/certificates/{{ _basename }}.key"
      deploy_dir: "{{ _deploy_dir }}"
      cert_file: "{{ _deploy_dir }}/fullchain.pem"
      key_file: "{{ _deploy_dir }}/privkey.pem"
      cert_owner: "{{ item.cert_owner | default(acme_client_default_cert_owner) }}"
      cert_group: "{{ item.cert_group | default(acme_client_default_cert_group) }}"
      cert_mode: "{{ item.cert_mode | default(acme_client_default_cert_mode) }}"
      key_owner: "{{ item.key_owner | default(acme_client_default_key_owner) }}"
      key_group: "{{ item.key_group | default(acme_client_default_key_group) }}"
      key_mode: "{{ item.key_mode | default(acme_client_default_key_mode) }}"
      reload_commands: "{{ item.reload_commands | default([]) }}"
      conf_file: "{{ acme_client_config_dir }}/certs/{{ item.zone }}.conf"
      reload_script: "{{ acme_client_config_dir }}/reload.d/{{ item.zone }}.sh"
  loop: "{{ acme_client_certificates }}"
  loop_control:
    label: "{{ item.zone }}"

# Units use the versioned path, not the symlink, so `systemctl cat` names the
# exact binary.
- name: Resolve the acme_client lego paths
  ansible.builtin.set_fact:
    _acme_client_lego_tarball: "lego_v{{ acme_client_lego_version }}_linux_{{ arch }}.tar.gz"
    _acme_client_lego_bin: "{{ acme_client_lego_install_dir }}/{{ acme_client_lego_version }}/lego"
    _acme_client_lego_release: "https://github.com/go-acme/lego/releases/download/v{{ acme_client_lego_version }}"

# 0700 throughout: the config dir holds the token, the state dir the account key
# and every private key. Install dir is 0755 - public binary.
- name: Create the acme_client directory tree
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ acme_client_config_dir }}"
      mode: "0700"
    - path: "{{ acme_client_config_dir }}/certs"
      mode: "0700"
    - path: "{{ acme_client_config_dir }}/reload.d"
      mode: "0700"
    - path: "{{ acme_client_state_dir }}"
      mode: "0700"
    - path: "{{ acme_client_cache_dir }}"
      mode: "0700"
    - path: "{{ acme_client_lego_install_dir }}/{{ acme_client_lego_version }}"
      mode: "0755"
  loop_control:
    label: "{{ item.path }}"

# One per CA host, hence unique - certificates from the same CA share an account
# key. lego creates certificates/ and accounts/ itself.
- name: Create the acme_client lego state directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop: "{{ _acme_client_certs | map(attribute='lego_dir') | unique | list }}"

# 0755, not 0700: the key's own 0640 is the protection, and the dir must stay
# traversable for the docker daemon and anything else reading the certificate.
- name: Create the acme_client deploy directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ _acme_client_certs | map(attribute='deploy_dir') | unique | list }}"

# Retiring a certificate = removing its entry, so the role must notice configs
# it did not write - otherwise a removed zone renews forever.
# Discovered here, not in 3_config, so `--skip-tags config` still defines it.
# 4_service acts on it, after stopping the timer.
- name: Find the acme_client certificate configs on the host
  ansible.builtin.find:
    paths: "{{ acme_client_config_dir }}/certs"
    patterns: "*.conf"
    file_type: file
  register: _acme_client_found_confs

- name: Determine the retired acme_client zones
  ansible.builtin.set_fact:
    _acme_client_retired_zones: >-
      {{ _acme_client_found_confs.files | map(attribute='path') | map('basename')
         | map('regex_replace', '\.conf$', '')
         | difference(_acme_client_certs | map(attribute='zone') | list) }}
