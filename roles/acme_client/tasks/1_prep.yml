---
# Fail before writing anything: most mistakes here surface somewhere else - a
# wrong resolver looks like a provider outage, an unreadable key like a broken
# container.
#
# ansible.cfg sets no_log globally, which would censor these messages, hence
# no_log: false. Safe: assert reports the expression, not values.
- name: Validate the acme_client role inputs
  ansible.builtin.assert:
    that:
      - acme_client_certificates | length > 0
      - acme_client_email | length > 0
      - acme_client_dns_api_token | length > 0
      - acme_client_dns_resolvers | length > 0
      - acme_client_certificates | rejectattr('zone', 'defined') | list | length == 0
      - (acme_client_certificates | map(attribute='zone') | unique | list | length)
        == (acme_client_certificates | length)
    fail_msg: >-
      acme_client needs a non-empty acme_client_certificates with a unique
      `zone` per entry, plus acme_client_email, acme_client_dns_api_token (from
      vault) and acme_client_dns_resolvers. The resolvers must stay public: this
      host resolves through the internal DNS, which is authoritative for these
      zones and never sees the challenge record, so lego would poll it, get
      NODATA and time out. Got zones:
      {{ acme_client_certificates | map(attribute='zone', default='<missing>') | list }}.
  no_log: false

# Both regexes are injection guards: the .conf holds single-quoted shell, and the
# zone is a systemd instance name and a path component.
#
# Not enforced: wildcard count or position. Several wildcard SANs are legitimate.
# The real hazard is reordering - lego names files after the first domain - but
# that applies to any reorder and cannot be checked from one run. README gotcha.
- name: Validate each acme_client certificate entry
  ansible.builtin.assert:
    that:
      - item.zone is match('^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$')
      - item.domains | default(['*.' ~ item.zone]) | length > 0
      - >-
        item.domains | default(['*.' ~ item.zone])
        | reject('match', '^(\*\.)?[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$')
        | list | length == 0
      - item.reload_commands | default([]) is sequence
      - item.reload_commands | default([]) is not string
    fail_msg: >-
      Invalid acme_client_certificates entry for zone {{ item.zone }}: {{ item }}.
      `zone` must be a lowercase DNS name, and `domains`, if given, must all be
      lowercase DNS names optionally prefixed with "*." - anything else could
      break out of the single-quoted shell values in the generated .conf.
      `reload_commands` must be a list.
  no_log: false
  loop: "{{ acme_client_certificates }}"
  loop_control:
    label: "{{ item.zone }}"

# Used three times in 2_install.
- name: Resolve the acme_client lego tarball name
  ansible.builtin.set_fact:
    _acme_client_lego_tarball: "lego_v{{ acme_client_lego_version }}_linux_{{ arch }}.tar.gz"

# 0700 on the config dir - it holds the API token. /var/lib/acme_client is left
# to lego, which creates its --path tree itself with the same 0700.
- name: Create the acme_client directory tree
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - path: /etc/acme-client
      mode: "0700"
    - path: /etc/acme-client/certs
      mode: "0700"
    - path: /etc/acme-client/reload.d
      mode: "0700"
    - path: /var/cache/acme-client
      mode: "0700"
    - path: "/usr/local/lib/lego/{{ acme_client_lego_version }}"
      mode: "0755"
  loop_control:
    label: "{{ item.path }}"

# 0755, not 0700: the key's own 0640 is the protection, and the dir must stay
# traversable for the docker daemon and anything else reading the certificate.
- name: Create the acme_client deploy directories
  ansible.builtin.file:
    path: "/etc/ssl/{{ item.zone }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ acme_client_certificates }}"
  loop_control:
    label: "{{ item.zone }}"
