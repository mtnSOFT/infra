---
# Cached, not fetched to a temp path: get_url checksums an existing dest first
# and skips the download, so a converge re-verifies ~70 MB instead of re-pulling.
# Checksum is not optional - this binary gets the DNS API token.
- name: Download the pinned lego release
  ansible.builtin.get_url:
    url: >-
      https://github.com/go-acme/lego/releases/download/v{{
      acme_client_lego_version }}/{{ _acme_client_lego_tarball }}
    dest: "/var/cache/acme-client/{{ _acme_client_lego_tarball }}"
    checksum: "sha256:{{ acme_client_lego_checksum }}"
    owner: root
    group: root
    mode: "0644"

# Flat tarball, so only the binary. `creates:` on the versioned path is what
# makes this both idempotent and able to upgrade.
- name: Extract the lego binary
  ansible.builtin.unarchive:
    src: "/var/cache/acme-client/{{ _acme_client_lego_tarball }}"
    dest: "/usr/local/lib/lego/{{ acme_client_lego_version }}"
    include:
      - lego
    remote_src: true
    creates: "/usr/local/lib/lego/{{ acme_client_lego_version }}/lego"

# unarchive's mode: applies to the dest dir, not the members.
- name: Set the lego binary permissions
  ansible.builtin.file:
    path: "/usr/local/lib/lego/{{ acme_client_lego_version }}/lego"
    state: file
    owner: root
    group: root
    mode: "0755"
