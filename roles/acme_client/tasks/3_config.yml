---
# Own file, passed to lego as INFOMANIAK_ACCESS_TOKEN_FILE. Not Environment=
# (unit files are world-readable, `systemctl cat` prints them) and not
# EnvironmentFile= (loaded into the process env, inherited by the reload
# commands, i.e. handed to docker compose).
#
# The trailing newline is load-bearing: lego strips exactly one "\n" and no other
# whitespace, so anything else is sent verbatim and returns an opaque 401. Keep
# the vault value a plain quoted scalar - a YAML "> " block adds its own newline.
- name: Render the acme_client DNS API token
  ansible.builtin.copy:
    content: "{{ acme_client_dns_api_token | trim }}\n"
    dest: /etc/acme-client/dns-api-token
    owner: root
    group: root
    mode: "0600"
  no_log: true

# Generic: they take the zone as $1 and read what varies from its .conf.
- name: Render the acme_client scripts
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/usr/local/bin/{{ item }}"
    owner: root
    group: root
    mode: "0700"
  loop:
    - acme-client-renew.sh
    - acme-client-deploy.sh

# Instantiated per zone. Buys per-zone isolation, a journal per zone, and an
# independent randomized delay.
- name: Render the acme_client systemd units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - acme-client-renew@.service
    - acme-client-renew@.timer

# Only what differs between zones. Everything else is baked into the scripts.
# 0640: no secrets here. Sits in a 0700 dir anyway.
- name: Render the acme_client certificate configs
  ansible.builtin.template:
    src: acme-client-cert.conf.j2
    dest: "/etc/acme-client/certs/{{ item.zone }}.conf"
    owner: root
    group: root
    mode: "0640"
  loop: "{{ acme_client_certificates }}"
  loop_control:
    label: "{{ item.zone }}"

# Separate script, not a .conf value: the commands are arbitrary strings, so as
# lines in a script they need no shell quoting. Always rendered - an empty one
# exits 0, which is simpler than a `when:` plus a task to remove the leftover.
- name: Render the acme_client reload scripts
  ansible.builtin.template:
    src: acme-client-reload.sh.j2
    dest: "/etc/acme-client/reload.d/{{ item.zone }}.sh"
    owner: root
    group: root
    mode: "0700"
  loop: "{{ acme_client_certificates }}"
  loop_control:
    label: "{{ item.zone }}"
