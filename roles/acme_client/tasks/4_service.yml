---
# daemon_reload here rather than a handler: nothing installed is long-running, so
# there is no service to restart.
# started, not restarted - restarting a timer re-draws its randomized delay.
#
# Removing an entry from acme_client_certificates does NOT retire its timer; that
# is a manual step, documented in the README.
- name: Enable the acme_client renewal timers
  ansible.builtin.systemd:
    name: "acme-client-renew@{{ item.zone }}.timer"
    daemon_reload: true
    enabled: true
    state: started
  loop: "{{ acme_client_certificates }}"
  loop_control:
    label: "{{ item.zone }}"
  when: acme_client_enable_timers | bool
