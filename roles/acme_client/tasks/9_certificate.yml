---
# Runs after the timers: a zone that fails here retries tonight on its own.
# Free to call every converge - lego does not touch the network when not due -
# and it puts the first certificate on a fresh host before a consumer role
# asserts it exists.
# --now drops lego's own sleep (up to 8 min when stdout is not a tty, which
# Ansible's pipe is), so an interactive run does not look hung. systemd omits it.
- name: Obtain or renew the acme_client certificates
  ansible.builtin.command:
    cmd: "/usr/local/bin/acme-client-renew.sh {{ item.zone }} --now"
  register: _acme_client_renew
  # Both constant: ansible-core no longer exposes result fields (stdout, rc) to
  # changed_when/failed_when, so the two tasks below answer those questions from
  # the registered results. Not failing here also reports every broken zone in
  # one run instead of stopping at the first.
  changed_when: false
  failed_when: false
  # This output is the story when something breaks, and holds nothing secret -
  # lego reads the token from a file.
  no_log: false
  loop: "{{ _acme_client_certs }}"
  loop_control:
    label: "{{ item.zone }}"
  when: acme_client_issue | bool

# changed for exactly the zones that replaced a pair; silent when all current.
- name: Report the acme_client certificates that were deployed
  ansible.builtin.debug:
    msg: "{{ item.item.zone }}: {{ item.stdout }}"
  changed_when: true
  no_log: false
  loop: >-
    {{ _acme_client_renew.results | default([])
       | selectattr('stdout', 'defined')
       | selectattr('stdout', 'search', 'acme-client: deployed') | list }}
  loop_control:
    label: "{{ item.item.zone }}"
  when: acme_client_issue | bool

- name: Assert every acme_client certificate was obtained
  ansible.builtin.assert:
    that:
      - _acme_client_renew.results | rejectattr('rc', 'equalto', 0) | list | length == 0
    fail_msg: >-
      lego failed for
      {{ _acme_client_renew.results | rejectattr('rc', 'equalto', 0)
         | map(attribute='item.zone') | list | join(', ') }}.
      If it waited and then timed out, the DNS-01 pre-check is almost certainly
      resolving the challenge name against the internal DNS instead of the
      public zone - check acme_client_dns_resolvers, and compare
      `dig @1.1.1.1 SOA _acme-challenge.<zone>` with `dig SOA
      _acme-challenge.<zone>`. Do not simply re-run: `lego run` issues a new
      certificate every time, and the limit is 5 per identical name set per 7
      days. Output:
      {{ _acme_client_renew.results | rejectattr('rc', 'equalto', 0)
         | map(attribute='stderr') | list }}
  no_log: false
  when: acme_client_issue | bool

# Verify the deploy landed here, not three roles later in a consumer.
- name: Stat the deployed acme_client certificates
  ansible.builtin.stat:
    path: "{{ item.cert_file }}"
    get_checksum: false
  register: _acme_client_cert_stat
  loop: "{{ _acme_client_certs }}"
  loop_control:
    label: "{{ item.zone }}"
  when: acme_client_issue | bool

- name: Stat the deployed acme_client private keys
  ansible.builtin.stat:
    path: "{{ item.key_file }}"
    get_checksum: false
  register: _acme_client_key_stat
  loop: "{{ _acme_client_certs }}"
  loop_control:
    label: "{{ item.zone }}"
  when: acme_client_issue | bool

- name: Assert the deployed acme_client certificates are in place
  ansible.builtin.assert:
    that:
      - item.stat.exists
      # isreg: consumer roles stat these paths and require a regular file, so a
      # symlink would break them.
      - item.stat.isreg
    fail_msg: >-
      {{ item.item.cert_file }} is missing or is not a regular file after a
      successful lego run for {{ item.item.zone }}. Check
      /usr/local/bin/acme-client-deploy.sh and the source path
      {{ item.item.src_cert }}.
  no_log: false
  loop: "{{ _acme_client_cert_stat.results | default([]) }}"
  loop_control:
    label: "{{ item.item.zone }}"
  when: acme_client_issue | bool

# Group and mode, not just existence: this is what decides whether a consumer can
# read the key at all.
- name: Assert the deployed acme_client private keys are readable by their consumers
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isreg
      - item.stat.mode == item.item.key_mode
      - >-
        item.stat.gr_name == item.item.key_group
        or (item.stat.gid | string) == (item.item.key_group | string)
    fail_msg: >-
      {{ item.item.key_file }} should be mode {{ item.item.key_mode }} and group
      {{ item.item.key_group }}, but is mode
      {{ item.stat.mode | default('<missing>') }} and group
      {{ item.stat.gr_name | default('<missing>') }}. A consumer that reads the
      mounted key as a non-root user - gitea reads it as uid/gid 1000 - cannot
      open it and will crash-loop.
  no_log: false
  loop: "{{ _acme_client_key_stat.results | default([]) }}"
  loop_control:
    label: "{{ item.item.zone }}"
  when: acme_client_issue | bool
