---
# Runs after the timers: a zone that fails here retries tonight on its own.
# Free to call every converge - lego does not touch the network when not due -
# and it puts the first certificate on a fresh host before a consumer role
# asserts it exists.
# --now drops lego's own sleep (up to 8 min when stdout is not a tty, which
# Ansible's pipe is), so an interactive run does not look hung. systemd omits it.
- name: Obtain or renew the acme_client certificates
  ansible.builtin.command:
    cmd: "/usr/local/bin/acme-client-renew.sh {{ item.zone }} --now"
  register: _acme_client_renew
  # Both constant: ansible-core no longer exposes result fields (stdout, rc) to
  # changed_when/failed_when, so the two tasks below answer those questions from
  # the registered results. Not failing here also reports every broken zone in
  # one run instead of stopping at the first.
  changed_when: false
  failed_when: false
  # This output is the story when something breaks, and holds nothing secret -
  # lego reads the token from a file.
  no_log: false
  loop: "{{ acme_client_certificates }}"
  loop_control:
    label: "{{ item.zone }}"
  when: acme_client_issue | bool

# changed for exactly the zones that replaced a pair; silent when all current.
- name: Report the acme_client certificates that were deployed
  ansible.builtin.debug:
    msg: "{{ item.item.zone }}: {{ item.stdout }}"
  changed_when: true
  no_log: false
  loop: >-
    {{ _acme_client_renew.results | default([])
       | selectattr('stdout', 'defined')
       | selectattr('stdout', 'search', 'acme-client: deployed') | list }}
  loop_control:
    label: "{{ item.item.zone }}"
  when: acme_client_issue | bool

- name: Assert every acme_client certificate was obtained
  ansible.builtin.assert:
    that:
      - _acme_client_renew.results | rejectattr('rc', 'equalto', 0) | list | length == 0
    fail_msg: >-
      lego failed for
      {{ _acme_client_renew.results | rejectattr('rc', 'equalto', 0)
         | map(attribute='item.zone') | list | join(', ') }}.
      If it waited and then timed out, the DNS-01 pre-check is almost certainly
      resolving the challenge name against the internal DNS instead of the
      public zone - check acme_client_dns_resolvers, and compare
      `dig @1.1.1.1 SOA _acme-challenge.<zone>` with `dig SOA
      _acme-challenge.<zone>`. Do not simply re-run: `lego run` issues a new
      certificate every time, and the limit is 5 per identical name set per 7
      days. Output:
      {{ _acme_client_renew.results | rejectattr('rc', 'equalto', 0)
         | map(attribute='stderr') | list }}
  no_log: false
  when: acme_client_issue | bool
