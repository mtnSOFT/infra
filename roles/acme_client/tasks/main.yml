---
# Task files run in order. Tags let you run a subset, e.g. `--tags install`.
# To add a task file, drop it in this folder and add an import below.
#
# Timers are installed before anything talks to a CA, so a zone that fails to
# issue retries on its own schedule.

# `always` too: everything below reads the facts this resolves, so a subset run
# would otherwise fail on an undefined variable.
- import_tasks: 1_prep.yml
  tags: [prep, always]

- import_tasks: 2_install.yml
  tags: [install]

- import_tasks: 3_config.yml
  tags: [config]

- import_tasks: 4_service.yml
  tags: [service]

- import_tasks: 9_certificate.yml
  tags: [certificate]
