---
# Clients are append-only, so nothing they do actually removes data. Pruning and
# compacting run here, against the local repository paths, where --append-only
# (a borg serve flag, not a repository setting) does not apply.
- name: Render the borg prune script
  ansible.builtin.template:
    src: borg-prune-all.sh.j2
    dest: /usr/local/bin/borg-prune-all.sh
    owner: root
    group: root
    mode: "0755"

- name: Render the borg prune systemd units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - borg-prune.service
    - borg-prune.timer

# Skipped where systemd is not PID 1, e.g. the molecule container.
- name: Enable the borg prune timer
  ansible.builtin.systemd_service:
    name: borg-prune.timer
    enabled: true
    state: started
    daemon_reload: true
  when: ansible_facts.service_mgr == 'systemd'
