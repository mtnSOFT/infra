---
- name: Render the btrfs scrub systemd units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - borg-scrub.service
    - borg-scrub.timer

- name: Enable the btrfs scrub timer
  ansible.builtin.systemd_service:
    name: borg-scrub.timer
    enabled: true
    state: started
    daemon_reload: true
  when:
    - ansible_facts.service_mgr == 'systemd'
    - borg_server_require_btrfs | bool
