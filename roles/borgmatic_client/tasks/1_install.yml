---
- name: Validate the borgmatic_client settings
  ansible.builtin.assert:
    that:
      - borgmatic_client_server | length > 0
      - borgmatic_client_server in hostvars
      - borgmatic_client_passphrase | length > 0
    fail_msg: >-
      borgmatic_client_server must name a host in the inventory and
      borgmatic_client_passphrase must be set. Got
      server={{ borgmatic_client_server }},
      passphrase_set={{ borgmatic_client_passphrase | length > 0 }}.
  # ansible.cfg turns no_log on for every task, which would censor the message.
  # The passphrase itself is not in it.
  no_log: false

# openssh-client for ssh-keygen and for borg's own connection.
- name: Install the borgmatic_client packages
  ansible.builtin.apt:
    name:
      - borgbackup
      - borgmatic
      - openssh-client
    state: present
