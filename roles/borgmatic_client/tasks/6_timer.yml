---
# Own units instead of the ones the Debian package ships, so the actions, the
# niceness and the schedule are in one place under this role's control.
- name: Render the borgmatic systemd units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - borgmatic.service
    - borgmatic.timer

# Skipped where systemd is not PID 1, e.g. the molecule container.
- name: Enable the borgmatic timer
  ansible.builtin.systemd_service:
    name: borgmatic.timer
    enabled: true
    state: started
    daemon_reload: true
  when: ansible_facts.service_mgr == 'systemd'

- name: Run a backup now
  ansible.builtin.command:
    cmd: borgmatic --verbosity 1 create --stats
  when: borgmatic_client_backup_now | bool
  no_log: false
