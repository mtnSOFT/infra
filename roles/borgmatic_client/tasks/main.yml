---
# Task files run in order. Tags let you run a subset, e.g. `--tags config`.
# To add a task file, drop it in this folder and add an import below.
#
# 1_install and 2_ssh have to run before the borg_server role (it reads the key
# 2_ssh generates); playbooks/borg_backup.yml handles that ordering.

- import_tasks: 1_install.yml
  tags: [install]

- import_tasks: 2_ssh.yml
  tags: [ssh]

- import_tasks: 3_config.yml
  tags: [config]

- import_tasks: 4_timer.yml
  tags: [timer]
