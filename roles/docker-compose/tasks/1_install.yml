---
- name: Install required system packages
  package:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    state: present
    update_cache: true

- name: Add Docker apt repository
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    uris: "https://download.docker.com/linux/ubuntu"
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: [stable]
    architectures: ["{{ arch }}"]
    signed_by: https://download.docker.com/linux/ubuntu/gpg
    state: present

- name: Remove legacy Docker apt list file
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/docker.list
    state: absent

- name: Update apt and install docker-ce and docker-compose-plugin
  package:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Ensure /containers directory exists
  file:
    path: /containers
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Copy docker daemon.json configuration
  copy:
    src: daemon.json
    dest: "/etc/docker/daemon.json"
    owner: root
    group: root
    mode: "0644"
  notify: Restart docker

- name: Ensure Docker is started and enabled
  service:
    name: docker
    state: started
    enabled: true
