---
- name: only when k3s master
  block:
    # argocd_version comes from the role defaults, where it is pinned and
    # annotated for Renovate. It used to be set to the floating "stable" tag here.
    - name: Create argocd namespace
      kubernetes.core.k8s:
        name: argocd
        api_version: v1
        kind: Namespace
        kubeconfig: "{{ kubeconfig }}"
        state: present

    - name: Deploy ArgoCD
      kubernetes.core.k8s:
        state: present
        namespace: argocd
        kubeconfig: "{{ kubeconfig }}"
        src: "https://raw.githubusercontent.com/argoproj/argo-cd/{{ argocd_version }}/manifests/install.yaml"

    - name: Wait for ArgoCD server deployment to exist
      kubernetes.core.k8s_info:
        kind: Deployment
        namespace: argocd
        name: argocd-server
        kubeconfig: "{{ kubeconfig }}"
        wait: yes
        wait_timeout: 300

    - name: Get ArgoCD initial admin password
      kubernetes.core.k8s_info:
        kind: Secret
        namespace: argocd
        name: argocd-initial-admin-secret
        kubeconfig: "{{ kubeconfig }}"
      register: argocd_secret

    - name: Display ArgoCD admin password
      debug:
        msg: "ArgoCD admin password: {{ argocd_secret.resources[0].data.password | b64decode }}"
      when: argocd_secret.resources | length > 0

    - name: Create ArgoCD Traefik internal servers transport
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        definition: "{{ lookup('file', 'argocd-traefik-internal-servers-transport.yml') }}"

    - name: Create ArgoCD Ingress
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        definition: "{{ lookup('template', 'argocd-ingress.yml.j2') }}"

  rescue:
    - name: ArgoCD install failed on k3s master
      debug:
        msg:
          - "ArgoCD install block failed on host {{ inventory_hostname }}."
          - "Review earlier task output for the root cause."

    - name: Fail explicitly after ArgoCD install error
      fail:
        msg: "ArgoCD installation/configuration failed on {{ inventory_hostname }}."

  when: inventory_hostname == k3s_master
