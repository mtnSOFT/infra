---
- name: Find netplan configs for host
  delegate_to: localhost # DevSkim: ignore DS162092 -- delegate_to localhost is intentionally
  become: false
  find:
    paths: "{{ inventory_dir }}/netplan_configs/{{ inventory_hostname }}"
    patterns: "*.yaml"
  register: netplan_configs

- name: Copy all netplan configs to host
  copy:
    src: "{{ config.path }}"
    dest: "/etc/netplan/{{ config.path | basename }}"
    owner: root
    group: root
    mode: "0600"
  loop_control:
    loop_var: config
  loop: "{{ netplan_configs.files }}"
  when: netplan_configs.matched > 0

- name: Remove default netplan configs if host has custom configs
  file:
    path: "/etc/netplan/{{ default_config }}"
    state: absent
  loop_control:
    loop_var: default_config
  loop:
    - 00-installer-config.yaml
    - 50-cloud-init.yaml
  when:
    - netplan_configs.matched > 0
    - default_config not in (netplan_configs.files | map(attribute='path') | map('basename') | list)

- name: Validate netplan configuration
  command: netplan try --timeout=10
  when: netplan_configs.matched > 0
  register: netplan_validation
  failed_when: netplan_validation.rc != 0

- name: Apply netplan configuration
  command: netplan apply
  when: netplan_configs.matched > 0 and netplan_validation.rc == 0
