---
# --- API connection -----------------------------------------------------------
# Same firewall and API user as opnsense_router, so every connection setting
# falls back to the matching opnsense_router_* variable. Override only if
# WireGuard is managed with a separate API user.
opnsense_wireguard_api_host: "{{ opnsense_router_api_host | default(ansible_host | default(inventory_hostname)) }}"
opnsense_wireguard_api_port: "{{ opnsense_router_api_port | default(443) }}"
opnsense_wireguard_api_key: "{{ opnsense_router_api_key | default('') }}"
opnsense_wireguard_api_secret: "{{ opnsense_router_api_secret | default('') }}"
opnsense_wireguard_ssl_verify: "{{ opnsense_router_ssl_verify | default(true) }}"

# --- Instance -----------------------------------------------------------------
# Name of the WireGuard instance (VPN > WireGuard > Instances).
opnsense_wireguard_name: wg0

# Key pair of the instance. OPNsense can't generate it through the API, and
# moving from the linux wireguard role means keeping stargate's keys so the
# existing client configs stay valid:
#   sudo wg show wg0 private-key   /   sudo wg show wg0 public-key
# Set both from the vault, e.g. "{{ vault_opnsense_wireguard_private_key }}".
# opnsense_wireguard_private_key:
# opnsense_wireguard_public_key:

# The rest comes from the same wireguard_* variables the linux wireguard role
# uses: wireguard_port, wireguard_internal_server_ip (tunnel address, e.g.
# 10.10.0.1/24), wireguard_mtu, wireguard_client_peers - plus what the
# wireguard_clients role needs for the client configs (wireguard_endpoint,
# wireguard_allowed_lan_ips, wireguard_dns_servers, wireguard_company).
wireguard_port: 51820
wireguard_mtu: ""
wireguard_client_peers: []

# Seconds to wait for the final WireGuard reload.
opnsense_wireguard_reload_timeout: 60
