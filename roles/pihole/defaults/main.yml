---
# Container image and tag for the Pi-hole stack
pihole_image: "pihole/pihole"
pihole_version_tag: "latest"

# Where the compose project and its persistent /etc/pihole volume live
pihole_dir: "/containers/pihole"

# Bring the stack up with `docker compose`. Set false to render the configuration
# only - that is what the molecule scenario does, since the test container has no
# docker daemon.
pihole_deploy: true

# Local DNS records served ahead of the upstreams - internal overrides, e.g. so
# vpn.example.com answers with the host's WireGuard address instead of the
# router's public IP. Rendered into FTL's dns.hosts, the same store the web
# admin's "Local DNS records" page uses; because it is set from the environment
# it is read-only there, and this list is authoritative - an entry removed here
# is removed from Pi-hole.
pihole_dns_records: []
# Example:
# pihole_dns_records:
#   - name: vpn.example.com
#     ip: 10.10.0.1

# Interface(s) FTL binds DNS on (host networking). Empty = listen on all
# interfaces. Set to one interface (e.g. wg0) to bind only that one, so Pi-hole
# can share :53 with another resolver on a different interface. Accepts a single
# interface (string) or a list (e.g. ["eth1", "wg0"]) to answer on several — a
# list is how you serve both a LAN interface and WireGuard (wg0) clients.
pihole_dns_interface: ""

# IP the web admin (80/443) binds to. Empty = all interfaces. FTL's web server
# binds by IP, not interface — e.g. wg0's address 10.10.0.1.
pihole_web_ip: ""
