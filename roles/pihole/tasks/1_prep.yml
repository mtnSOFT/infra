---
# The records are joined into FTLCONF_dns_hosts, where ";" separates entries and
# " " separates the IP from the hostname - a stray one of either silently
# corrupts the whole array, so reject them before rendering.
- name: Validate Pi-hole local DNS records
  ansible.builtin.assert:
    that:
      # Key presence first: assert stops at the first failure, so the map()s below
      # can never trip over an entry that is missing one of them.
      - pihole_dns_records | rejectattr('name', 'defined') | list | length == 0
      - pihole_dns_records | rejectattr('ip', 'defined') | list | length == 0
      - pihole_dns_records | map(attribute='name') | select('search', '[;\s]') | list | length == 0
      - pihole_dns_records | map(attribute='ip') | select('search', '[;\s]') | list | length == 0
    fail_msg: >-
      Every pihole_dns_records entry needs a `name` and an `ip`, and neither may
      contain whitespace or ";". Got: {{ pihole_dns_records }}.
  when: pihole_dns_records | length > 0

# Each entry becomes a `server=/<zone>/<server>[#<port>]` dnsmasq line, so "/"
# and "#" are structural here on top of ";" and whitespace.
- name: Validate Pi-hole delegated zones
  ansible.builtin.assert:
    that:
      - pihole_dns_forward_zones | rejectattr('zone', 'defined') | list | length == 0
      - pihole_dns_forward_zones | rejectattr('server', 'defined') | list | length == 0
      - pihole_dns_forward_zones | map(attribute='zone') | select('search', '[;\s/]') | list | length == 0
      - pihole_dns_forward_zones | map(attribute='server') | select('search', '[;\s/#]') | list | length == 0
      - pihole_dns_forward_zones | selectattr('port', 'defined') | map(attribute='port') | map('string') | select('search', '[^0-9]') | list | length == 0
    fail_msg: >-
      Every pihole_dns_forward_zones entry needs a `zone` and a `server`. Neither
      may contain whitespace or ";", `zone` may not contain "/", and `server` may
      not contain "/" or "#" - give the port as the separate numeric `port` key.
      Got: {{ pihole_dns_forward_zones }}.
  when: pihole_dns_forward_zones | length > 0

- name: Create Pi-hole project directory
  ansible.builtin.file:
    path: "{{ pihole_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Create Pi-hole persistent config directory
  ansible.builtin.file:
    path: "{{ pihole_dir }}/etc-pihole"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Render Pi-hole secrets env file
  ansible.builtin.template:
    src: pihole.env.j2
    dest: "{{ pihole_dir }}/.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Render Pi-hole compose file
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ pihole_dir }}/compose.yaml"
    owner: root
    group: root
    mode: "0644"
