---
# Loaded here too, so `--tags clients` works without the server-config step.
- name: Load the server keys
  include_tasks: "process-server-keys.yml"

# Client keys and the vaulted client configs - shared with opnsense_wireguard.
- name: Create client configs
  ansible.builtin.import_role:
    name: wireguard_clients

- name: Append peer config to server config
  ansible.builtin.blockinfile:
    path: /etc/wireguard/{{ wireguard_interface }}.conf
    block: "{{ lookup('template', 'client-peer-section.conf.j2') }}"
    marker: "# {mark} peer {{ peer.name }}"
    insertafter: EOF
  loop: "{{ wireguard_clients_peers }}"
  loop_control:
    loop_var: peer
    label: "{{ peer.name }}"
  changed_when: false
